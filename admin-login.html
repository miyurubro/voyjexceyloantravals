<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | VoyageX Ceylon Travels</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/logo1.png">

    <style>
        body {
            background: #08090d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            font-family: var(--font-body);
        }

        .login-bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .login-card {
            background: rgba(18, 19, 26, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            padding: 40px 36px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .brand-logo-wrap {
            margin-bottom: 24px;
        }

        .brand-logo-wrap img {
            height: 54px;
            width: auto;
        }

        .security-shield-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 87, 34, 0.12);
            border: 2px solid rgba(255, 87, 34, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--clr-primary);
            font-size: 1.5rem;
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: var(--clr-text-muted);
            margin-bottom: 28px;
        }

        .form-group-login {
            text-align: left;
            margin-bottom: 18px;
            position: relative;
        }

        .form-group-login label {
            display: block;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            transition: all var(--transition-normal);
        }

        .login-input:focus {
            outline: none;
            border-color: var(--clr-primary);
            background: rgba(255, 87, 34, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 87, 34, 0.2);
        }

        .input-icon-left {
            position: absolute;
            left: 16px;
            top: 38px;
            color: #64748b;
            font-size: 0.95rem;
        }

        .error-message-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-bottom: 18px;
            display: none;
            text-align: left;
        }

        .btn-login-submit {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: var(--clr-primary);
            color: #fff;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.4);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-login-submit:hover {
            background: var(--clr-primary-hover);
            transform: translateY(-1px);
        }

        .quick-demo-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px;
            margin-top: 24px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: left;
        }

        .btn-demo-fill {
            background: rgba(255, 87, 34, 0.15);
            border: 1px solid rgba(255, 87, 34, 0.3);
            color: var(--clr-primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            float: right;
            font-weight: 600;
        }

        .btn-demo-fill:hover {
            background: var(--clr-primary);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="login-bg-glow"></div>

    <div class="login-card">
        <div class="brand-logo-wrap">
            <img src="images/custom.png" alt="VoyageX Ceylon Travels">
        </div>

        <div class="security-shield-icon">
            <i class="fas fa-user-shield"></i>
        </div>

        <h1 class="login-title">Admin Command Portal</h1>
        <p class="login-subtitle">Central Fleet Tracking & Tour Dispatch Terminal</p>

        <div class="error-message-box" id="loginError">
            <i class="fas fa-exclamation-circle" style="margin-right: 6px;"></i>
            <span id="errorText">Invalid administrative credentials.</span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group-login">
                <label>Admin Username</label>
                <i class="fas fa-user-lock input-icon-left"></i>
                <input type="text" id="adminUser" class="login-input" placeholder="e.g. admin" required autocomplete="username">
            </div>

            <div class="form-group-login">
                <label>Security Password</label>
                <i class="fas fa-key input-icon-left"></i>
                <input type="password" id="adminPass" class="login-input" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.8rem; color: #94a3b8;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="rememberMe" checked> Remember Device
                </label>
                <a href="#" onclick="alert('Default credentials: username: admin / password: voyagex2026'); return false;" style="color: var(--clr-primary);">Need Help?</a>
            </div>

            <button type="submit" class="btn-login-submit">
                <i class="fas fa-sign-in-alt"></i> Access Admin Console
            </button>
        </form>

        <div class="quick-demo-pill">
            <button type="button" class="btn-demo-fill" onclick="autoFillDemo()">1-Click Demo</button>
            <strong style="color: #fff;">Authorized Access Only:</strong><br>
            User: <code style="color: var(--clr-primary);">admin</code> | Pass: <code style="color: var(--clr-primary);">voyagex2026</code>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect straight to admin.html
            if (sessionStorage.getItem('voyagex_admin_auth') === 'true' || localStorage.getItem('voyagex_admin_auth') === 'true') {
                window.location.href = 'admin.html';
            }

            const form = document.getElementById('adminLoginForm');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('adminUser').value.trim();
                const p = document.getElementById('adminPass').value.trim();
                const remember = document.getElementById('rememberMe').checked;

                // Valid Admin Credentials
                if ((u === 'admin' || u === 'voyagex') && (p === 'voyagex2026' || p === 'admin123' || p === '1234')) {
                    sessionStorage.setItem('voyagex_admin_auth', 'true');
                    sessionStorage.setItem('voyagex_admin_name', 'VoyageX Operations Lead');
                    if (remember) {
                        localStorage.setItem('voyagex_admin_auth', 'true');
                    }
                    window.location.href = 'admin.html';
                } else {
                    const errBox = document.getElementById('loginError');
                    errBox.style.display = 'block';
                    document.getElementById('errorText').innerText = 'Authentication failed. Please verify credentials.';
                }
            });
        });

        function autoFillDemo() {
            document.getElementById('adminUser').value = 'admin';
            document.getElementById('adminPass').value = 'voyagex2026';
            document.getElementById('loginError').style.display = 'none';
        }
    </script>
</body>

</html>
